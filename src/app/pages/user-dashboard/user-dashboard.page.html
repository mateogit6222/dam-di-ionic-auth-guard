<ion-header [translucent]="true">
  <ion-toolbar color="secondary">
    <ion-title>Panel del Operador</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="handleLogout()">Cerrar Sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Bienvenido, {{ currentSession()?.username }}</ion-card-title>
      <ion-card-subtitle>Nivel de acceso: Operador</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Validado por <code>roleGuard('user')</code>.</p>
      <p>Si intentas escribir <code>/admin</code> en la URL, el sistema te redirigirá aquí.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
