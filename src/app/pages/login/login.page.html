<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Control de Acceso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Iniciar Sesión</ion-card-title>
      <ion-card-subtitle>admin/123 o operador/123</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-item fill="outline" class="ion-margin-bottom">
        <ion-label position="floating">Usuario</ion-label>
        <ion-input type="text" [(ngModel)]="username" placeholder="admin u operador"></ion-input>
      </ion-item>
      <ion-item fill="outline" class="ion-margin-bottom">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="password" placeholder="123"></ion-input>
      </ion-item>
      <ion-button expand="block" (click)="handleLogin()" class="ion-margin-top">
        Acceder al Panel
      </ion-button>
      @if (errorMessage) {
        <ion-text color="danger">
          <p class="ion-text-center">{{ errorMessage }}</p>
        </ion-text>
      }
    </ion-card-content>
  </ion-card>
</ion-content>
