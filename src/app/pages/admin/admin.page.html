<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-title>Zona Segura: Panel Admin</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="handleLogout()">Cerrar Sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card color="light">
    <ion-card-header>
      <ion-card-title>Bienvenido, {{ currentSession()?.username }}</ion-card-title>
      <ion-card-subtitle>Rol: {{ currentSession()?.role }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Has superado la validación de <code>authGuard</code> y <code>roleGuard('admin')</code>.</p>
      <p>Estado almacenado en <code>sessionStorage</code> bajo la clave <code>DAM2_AUTH_SESSION</code>.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
